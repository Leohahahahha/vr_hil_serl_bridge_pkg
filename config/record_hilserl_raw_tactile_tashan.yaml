# Raw dataset collection config for record_raw_hilserl_zed_tactile.py.
# Run on the ROS2 / perception machine.

dataset:
  root: "/home/enine/data_collect/vive_teleop_tactile/ros2_ws_recording_patch/dataset_tactile/fr3_zed_raw_tactile_tashan"

record:
  fps: 10.0
  num_episodes: 50
  max_episode_sec: 300.0
  warmup_timeout_sec: 30.0
  task_description: "fr3 zed tactile raw teleop via hilserl franka_server"
  task_index: 0
  wait_for_motion_enable_to_record: false
  debug: true

server:
  # Robot-control PC IP + franka_server Flask port.
  url: "http://172.31.179.19:5000"
  http_timeout_sec: 0.08
  control_hz: 10.0
  state_poll_hz: 30.0


image:
  topic: "/zed/zed_node/rgb/color/rect/image"
  name: "front"

wrist_image:
  topic: "/camera/d405/color/image_raw"
  camera_info_topic: "/camera/d405/color/camera_info"
  name: "wrist"

tactile:
  msg_package: "tashan_tactile"
  left_topic: "/tashan_tactile/left/data"
  right_topic: "/tashan_tactile/right/data"

vr:
  target_pose_topic: "/vr_bridge/target_pose"
  enabled_topic: "/vr_bridge/enabled"
  joystick_y_topic: "/vr/right_controller/joystick_y"

# Topics published by tactile_franka_http_bridge.
command:
  command_event_topic: "/hilserl/command_event_json"

robot_state:
  state_topic: "/hilserl/robot_state_json"

safety:
  # Optional workspace clipping before POST /pose. Set enabled=false if you already clip elsewhere.
  clip_workspace: false
  x_min: 0.25
  x_max: 0.85
  y_min: -0.45
  y_max: 0.45
  z_min: 0.02
  z_max: 0.65

sync:
  # Fixed-FPS sampling. Each frame chooses nearest sensor/action/state by monotonic time.
  max_image_dt_sec: 0.10
  max_wrist_image_dt_sec: 0.10
  max_action_dt_sec: 0.10
  max_state_dt_sec: 0.10
  max_vr_dt_sec: 0.10
  max_tactile_dt_sec: 0.10
  use_monotonic_time: true


output:
  save_master_parquet_every_episode: true
  save_debug_jsonl: true
