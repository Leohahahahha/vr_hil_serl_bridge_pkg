# Total raw collection config for the x86_64 DM-Tac W SDK 0.1.4 bridge.

dataset:
  # Always use a new empty root. Never append schema-3 rows to a schema-1 zarr.
  #root: "/home/enine/data_collect/vive_teleop_tactile/ros2_ws_recording_patch/dataset_tactile/fr3_zed_raw_tactile_dmtac_w_sdk014"
  root: "/home/enine/data_collect/datasets/dmtac_w/smoke_shear_depth_20260823_001"
  
record:
  fps: 10.0
  # num_episodes: 50
  # max_episode_sec: 300.0
  num_episodes: 1
  max_episode_sec: 20.0
  
  warmup_timeout_sec: 30.0
  task_description: "fr3 zed DM-Tac W SDK 0.1.4 raw teleop via hilserl franka_server"
  task_index: 0
  # Pause the logical episode timeline while the VR motion enable is released.
  # Disabled wall-clock intervals create no rows or candidate-index gaps.
  wait_for_motion_enable_to_record: true
  debug: true
  # Run camera, tactile, action and state callbacks concurrently. Heavy
  # packed-tactile copies no longer serialize both camera callbacks.
  executor_threads: 4
  # Keep enough capture history to survive a temporary writer slowdown while
  # the performance fixes below are being verified on the real host.
  buffer_history_sec: 5.0
  # Keep pre-action waiting candidates ignored, but reject an episode before
  # commit when any candidate is skipped after the first usable action. The
  # same episode index is then offered for re-recording, like r + Enter.
  discard_episode_on_active_skip: true

server:
  url: "http://172.31.179.19:5000"
  http_timeout_sec: 0.08
  control_hz: 10.0
  state_poll_hz: 30.0

image:
  topic: "/zed/zed_node/rgb/color/rect/image/compressed"
  name: "front"
  # ZED runs on the Orin and publishes JPEG-compressed RGB at 30 Hz. The
  # recorder keeps the original capture stamp and writes selected 10 Hz JPEG
  # bytes without decode/re-encode. Set message_type="raw" and remove the
  # /compressed suffix to use the legacy sensor_msgs/Image path.
  message_type: "compressed"
  expected_hz: 30.0
  qos_reliability: "best_effort"
  qos_depth: 1

wrist_image:
  topic: "/camera/d405/color/image_raw"
  camera_info_topic: "/camera/d405/color/camera_info"
  name: "wrist"
  expected_hz: 30.0
  # Training needs the latest capture, not a reliable queue of old images.
  qos_reliability: "best_effort"
  qos_depth: 1

tactile:
  msg_package: "dmtac_tactile"
  base_topic: "/dmtac"
  # Must match dmtac_w_bridge.params.yaml. "shear_depth" records schema 3
  # (921,600 bytes/side); switch both files to "full" for legacy schema 1.
  output_mode: "shear_depth"
  expected_hz: 30.0
  # The bridge samples at up to 30 Hz and publishes one packed message per
  # side. The 10 Hz recorder selects the nearest frame by the worker's capture
  # timestamp mapped into the monotonic clock domain.
  left:
    packed_topic: "/dmtac/left/packed_frame"
  right:
    packed_topic: "/dmtac/right/packed_frame"

vr:
  target_pose_topic: "/vr_bridge/target_pose"
  enabled_topic: "/vr_bridge/enabled"
  joystick_y_topic: "/vr/right_controller/joystick_y"

command:
  command_event_topic: "/hilserl/command_event_json"

robot_state:
  state_topic: "/hilserl/robot_state_json"

safety:
  clip_workspace: false
  x_min: 0.25
  x_max: 0.85
  y_min: -0.45
  y_max: 0.45
  z_min: 0.02
  z_max: 0.65

sync:
  max_image_dt_sec: 0.10
  max_wrist_image_dt_sec: 0.10
  max_action_dt_sec: 0.08
  max_state_dt_sec: 0.08
  max_vr_dt_sec: 0.10
  max_tactile_dt_sec: 0.15
  # Keep the 10 Hz candidate grid unchanged, but wait for slightly delayed
  # camera/action messages before choosing the nearest sample.
  sync_lag_sec: 0.25
  # ZED and D405 header stamps are wall-clock capture times; map them into the
  # recorder's monotonic domain instead of using callback time.
  # The front ZED stamp is now generated by the Orin, so chrony/PTP must keep
  # both hosts synchronised. Apparent age includes processing/network delay and
  # any residual wall-clock offset.
  use_image_header_stamp: true
  max_remote_image_transport_sec: 0.20
  max_remote_image_future_sec: 0.05
  reject_unsynced_remote_stamp: true
  timestamp_diagnostics_interval_sec: 5.0
  # A source image may be selected at most once. The sampler can select the
  # next-nearest newer capture within the existing sync threshold.
  require_unique_image_stamps: true
  use_monotonic_time: true

output:
  save_master_parquet_every_episode: true
  save_debug_jsonl: true
  # One task contains the front JPEG, wrist PNG and both tactile sides. The
  # bounded queue gives explicit backpressure instead of silently growing
  # memory without limit.
  write_queue_size: 48
  # Resize/write both zarr arrays once per batch, not once per frame and side.
  tactile_batch_frames: 8
  # The remote ZED frame is already JPEG. Preserve those exact bytes instead
  # of decoding and re-encoding them as PNG in the real-time writer.
  preserve_compressed_images: true
  # D405 remains lossless PNG, using the fast compression setting.
  png_compress_level: 1
  writer_diagnostics_interval_sec: 5.0
